spring.application.name=ppraAMS

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/Ppra}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

logging.level.org.springframework.security=DEBUG
logging.level.tz.ppra.ppraAMS=DEBUG


spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=profile,email
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.config.import=optional:file:.env[.properties]
app.frontend-url=http://localhost:4200

spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.options.model=llama3.2:3b
spring.ai.ollama.chat.options.temperature=0
spring.ai.ollama.chat.options.keep-alive=30m
spring.ai.ollama.init.pull-model-strategy=never
spring.mvc.async.request-timeout=120000

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.http.client.read-timeout=300s
